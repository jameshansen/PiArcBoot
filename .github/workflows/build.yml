# Builds PiArcBoot on every push: for 64-bit Raspberry Pi OS on an ARM runner, for x86-64 Linux, and
# for 64-bit Windows with zig, each as an installer and a portable copy, both zips, and for macOS
# as an application for Apple silicon and Intel Macs, zipped and tested on both. A version tag
# (v1.2.3) also publishes them as a release of that name, with install.sh and install.ps1, which
# download and run the installer from a terminal. Its notes are a table of the downloads
# (docs/releases/download.md, with the tag filled in) and then docs/releases/v1.2.3.md, and the
# About tab shows the tag's version.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ROOGUI_REF: c66857c7da2442c88b4707c9758c15f68d9ecbcb   # the ROOGUI commit a release is built with
  SDL_VERSION: 2.32.10
  ZLIB_VERSION: 1.3.1
  ZIG_VERSION: 0.16.0

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            name: RaspberryPi
          - arch: x86-64
            runner: ubuntu-24.04
            name: Linux-x86-64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jameshansen/ROOGUI
          ref: ${{ env.ROOGUI_REF }}
          path: roogui
      - name: Install SDL2 and zlib
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev zlib1g-dev
      - name: Build and run the self-tests
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then V=${GITHUB_REF_NAME#v}; else V=dev-${GITHUB_SHA::7}; fi
          make -j"$(nproc)" VERSION="$V"
          make check
      - name: Package
        run: |
          mkdir -p dist/PiArcBoot
          cp -r build/piarcboot build/libroogui.so build/LICENSE-ROOGUI ROM311 icons presets shaders icon.png LICENSE dist/PiArcBoot/
          make build/stub
          python3 tools/mkinstaller.py build/stub dist/PiArcBoot "dist/Install PiArcBoot"
          (cd dist && zip -q "../PiArcBoot-Installer-${{ matrix.name }}.zip" "Install PiArcBoot")
          mkdir dist/PiArcBoot/Data               # a portable copy keeps its games and saves in here
          (cd dist && zip -qr "../PiArcBoot-Portable-${{ matrix.name }}.zip" PiArcBoot)
      - name: Test the installer
        run: |
          PIARCBOOT_HOME=$PWD/build/setup-home "dist/Install PiArcBoot" --quiet
          PIARCBOOT_HOME=$PWD/build/setup-home build/setup-home/Programs/PiArcBoot/piarcboot check
      - uses: actions/upload-artifact@v4
        with:
          name: PiArcBoot-${{ matrix.name }}
          path: PiArcBoot-*-${{ matrix.name }}.zip

  windows:
    name: Windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jameshansen/ROOGUI
          ref: ${{ env.ROOGUI_REF }}
          path: roogui
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Fetch SDL2 and build zlib
        run: |
          mkdir -p deps && cd deps
          curl -fsSL "https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION/SDL2-devel-$SDL_VERSION-mingw.tar.gz" | tar -xz
          curl -fsSL "https://github.com/madler/zlib/releases/download/v$ZLIB_VERSION/zlib-$ZLIB_VERSION.tar.gz" | tar -xz
          cd "zlib-$ZLIB_VERSION"
          # zlib1.dll exporting the functions PiArcBoot and ROOGUI call, with its import library
          printf 'LIBRARY zlib1.dll\nEXPORTS\ninflateInit2_\ninflate\ninflateEnd\ninflateReset\ncompress2\ncompressBound\nuncompress\ncrc32\n' > zlib1.def
          zig cc -target x86_64-windows-gnu -O2 -shared -o zlib1.dll adler32.c compress.c crc32.c deflate.c \
            infback.c inffast.c inflate.c inftrees.c trees.c uncompr.c zutil.c zlib1.def -Wl,--out-implib,libz.dll.a
      - name: Build
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then V=${GITHUB_REF_NAME#v}; else V=dev-${GITHUB_SHA::7}; fi
          VERSION="$V" sh tools/build-windows.sh "$PWD/deps/SDL2-$SDL_VERSION/x86_64-w64-mingw32" "$PWD/deps/zlib-$ZLIB_VERSION"
      - name: Package
        run: |
          rm -f build/win/PiArcBoot/*.pdb
          python3 tools/mkinstaller.py build/win/stub.exe build/win/PiArcBoot "build/win/Install PiArcBoot.exe"
          (cd build/win && zip -q ../../PiArcBoot-Installer-Windows.zip "Install PiArcBoot.exe")
          mkdir build/win/PiArcBoot/Data          # a portable copy keeps its games and saves in here
          (cd build/win && zip -qr ../../PiArcBoot-Portable-Windows.zip PiArcBoot)
      - uses: actions/upload-artifact@v4
        with:
          name: PiArcBoot-Windows
          path: PiArcBoot-*-Windows.zip

  # One application for both kinds of Mac. Xcode 16.4 builds for macOS 10.13 as Apple supports it,
  # which the Intel half runs on, and the Apple silicon half runs on macOS 11, as every Apple
  # silicon Mac has. macOS 15 is the newest image with Xcode 16.
  macos:
    name: macOS
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jameshansen/ROOGUI
          ref: ${{ env.ROOGUI_REF }}
          path: roogui
      - name: Fetch SDL2
        run: |
          mkdir -p deps
          curl -fsSL -o deps/SDL2.dmg "https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION/SDL2-$SDL_VERSION.dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/sdl" deps/SDL2.dmg
          cp -R "$RUNNER_TEMP/sdl/SDL2.framework" deps/
          hdiutil detach "$RUNNER_TEMP/sdl"
      - name: Build
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then V=${GITHUB_REF_NAME#v}; else V=dev-${GITHUB_SHA::7}; fi
          xcodebuild -version
          make -j"$(sysctl -n hw.ncpu)" VERSION="$V" SDL_FRAMEWORKS=deps ARCHS="arm64 x86_64"
          sh tools/mkmacapp.sh "$V"
      - name: Check the oldest macOS each half runs on
        run: |
          for f in build/PiArcBoot.app/Contents/MacOS/piarcboot build/PiArcBoot.app/Contents/Frameworks/libroogui.dylib; do
            for a in x86_64:10.13 arm64:11.0; do
              # minos in a build version record, version in the older kind a 10.13 target gets
              got=$(vtool -arch "${a%%:*}" -show-build "$f" | awk '/minos|^ *version/ { print $2; exit }')
              echo "$f ${a%%:*}: macOS $got"
              [ "$got" = "${a#*:}" ] || { echo "::error::$f's ${a%%:*} half needs macOS $got, where ${a#*:} is promised"; exit 1; }
            done
          done
      - name: Run the self-tests and boot a game on Apple silicon
        run: sh tests/macboot.sh build/PiArcBoot.app
      - name: Package
        run: (cd build && ditto -c -k --keepParent PiArcBoot.app ../PiArcBoot-macOS.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: PiArcBoot-macOS
          path: PiArcBoot-macOS.zip

  # The same zip on an Intel Mac, which GitHub has until the macOS 15 image retires
  macos-intel:
    name: macOS on Intel
    needs: macos
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PiArcBoot-macOS
      - name: Run the self-tests and boot a game on Intel
        run: |
          ditto -x -k PiArcBoot-macOS.zip "$RUNNER_TEMP"
          codesign --verify --deep --strict "$RUNNER_TEMP/PiArcBoot.app"
          sh tests/macboot.sh "$RUNNER_TEMP/PiArcBoot.app"

  release:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [linux, windows, macos, macos-intel]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The release's own notes, what changed since the last one, are written in
          # docs/releases/<tag>.md before the tag is pushed. Without them nothing is published.
          if [ ! -f "docs/releases/$TAG.md" ]; then
            echo "::error::docs/releases/$TAG.md is missing. Write the release notes before tagging."
            exit 1
          fi
          # They open with a table of the downloads for each system, linked to this release's files
          { sed "s/{TAG}/$TAG/g" docs/releases/download.md; cat "docs/releases/$TAG.md"; } > notes.md
          # The terminal scripts fetch the installer from the release they came with
          sed "s/{TAG}/$TAG/g" install.sh > out/install.sh
          sed "s/{TAG}/$TAG/g" install.ps1 > out/install.ps1
          files=
          for kind in Installer Portable; do
            for os in RaspberryPi Windows Linux-x86-64; do files="$files out/PiArcBoot-$kind-$os.zip"; done
          done
          files="$files out/PiArcBoot-macOS.zip out/install.sh out/install.ps1"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" $files --verify-tag --title "PiArcBoot $TAG" --notes-file notes.md
          fi
